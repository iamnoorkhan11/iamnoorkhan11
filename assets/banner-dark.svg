<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
  <title id="title">Noor Khan: Semantic SEO and AI Search Strategist</title>
  <desc id="desc">Banner with an entity graph connecting Semantic SEO to entities, topical maps, search intent, schema, AI Overviews and ChatGPT.</desc>
  <defs>
    <radialGradient id="glow" cx="78%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0a66c2" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0a66c2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="rgba(238,243,249,0.05)" stroke-width="1"/>
    </pattern>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0%" stop-color="#0a66c2"/><stop offset="100%" stop-color="#4b9dea"/>
    </linearGradient>
  </defs>
  <style>
    .node{animation:pulse 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .halo{animation:halo 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .flow{animation:flow 2.4s linear infinite}
    .fade{animation:fade 1s ease-out both}
    .fade2{animation:fade 1s .25s ease-out both}
    .fade3{animation:fade 1s .5s ease-out both}
    @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.75}}
    @keyframes halo{0%,100%{transform:scale(1);opacity:.15}50%{transform:scale(1.5);opacity:0}}
    @keyframes flow{to{stroke-dashoffset:-24}}
    @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){.node,.halo,.flow,.fade,.fade2,.fade3{animation:none}}
  </style>
  <rect width="1280" height="340" rx="18" fill="#0d1117"/>
  <rect width="1280" height="340" rx="18" fill="url(#grid)"/>
  <rect width="1280" height="340" rx="18" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="5" fill="url(#bar)"/>
  <g>
    <line class="edge flow" style="animation-delay:0.00s" x1="990" y1="170" x2="860" y2="78" stroke="rgba(75,157,234,0.35)" stroke-width="1.6" stroke-dasharray="6 6"/>
