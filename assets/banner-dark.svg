    <line class="edge" style="animation-delay:5.18s" x1="905" y1="285" x2="800" y2="190" stroke="rgba(75,157,234,0.35)" stroke-width="1"/>
    <line class="edge" style="animation-delay:5.55s" x1="800" y1="190" x2="760" y2="112" stroke="rgba(75,157,234,0.35)" stroke-width="1"/>
    <line class="edge" style="animation-delay:5.92s" x1="760" y1="112" x2="860" y2="78" stroke="rgba(75,157,234,0.35)" stroke-width="1"/>
    <line class="edge" style="animation-delay:6.29s" x1="860" y1="78" x2="800" y2="190" stroke="rgba(75,157,234,0.35)" stroke-width="1"/>
    <line class="edge" style="animation-delay:6.66s" x1="1135" y1="70" x2="1185" y2="190" stroke="rgba(75,157,234,0.35)" stroke-width="1"/>
  </g>
