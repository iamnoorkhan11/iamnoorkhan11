    <circle cx="1185" cy="190" r="7" fill="#4b9dea" class="node" style="animation-delay:1.35s"/><text x="1185" y="216" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="rgba(238,243,249,0.78)">AI Overviews</text>
    <circle cx="1110" cy="282" r="7" fill="#4b9dea" class="node" style="animation-delay:1.80s"/><text x="1110" y="308" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="rgba(238,243,249,0.78)">ChatGPT</text>
