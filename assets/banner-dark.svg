  <g transform="translate(72 0)">
    <text class="fade" x="0" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="700" letter-spacing="3" fill="#eef3f9">NOOR KHAN</text>
    <text class="fade2" x="2" y="176" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#4b9dea">Semantic SEO &amp; AI Search Strategist</text>
