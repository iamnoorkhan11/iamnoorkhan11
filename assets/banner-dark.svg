    <circle cx="800" cy="190" r="7" fill="#4b9dea" class="node" style="animation-delay:2.70s"/><text x="800" y="216" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="rgba(238,243,249,0.78)">Search Intent</text>
